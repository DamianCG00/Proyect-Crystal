name: CI Pipeline - Crystal API

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
   
    defaults:
      run:
        working-directory: ./Crystal.Api

    steps:
    - name: Descargar el código del repositorio
      uses: actions/checkout@v4

    - name: Configurar entorno .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restaurar dependencias de la solución
      run: dotnet restore

    - name: Compilar el proyecto (Build)
      run: dotnet build --no-restore

    - name: Ejecutar pruebas xUnit (Test)
      run: dotnet test --no-build --verbosity normal